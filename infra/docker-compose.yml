services:

  db:
    image: postgres:16-alpine
    container_name: innerchess-db
    environment:
      POSTGRES_DB: innerchess
      POSTGRES_USER: innerchess
      POSTGRES_PASSWORD: innerchess
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerchess"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: innerchess-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/innerchess
      SPRING_DATASOURCE_USERNAME: innerchess
      SPRING_DATASOURCE_PASSWORD: innerchess
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/puzzles/random"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ../frontend
    container_name: innerchess-frontend
    ports:
      - "5173:5173"
    environment:
      # The browser runs on the host, so it reaches the backend via the
      # published port, not the compose network.
      VITE_API_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:5
    container_name: innerchess-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data: