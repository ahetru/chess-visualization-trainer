services:

  db:
    image: postgres:16
    container_name: innerchess-db
    environment:
      POSTGRES_DB: innerchess
      POSTGRES_USER: innerchess
      POSTGRES_PASSWORD: innerchess
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innerchess"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: innerchess-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/innerchess
      SPRING_DATASOURCE_USERNAME: innerchess
      SPRING_DATASOURCE_PASSWORD: innerchess

  frontend:
    build: ../frontend
    container_name: innerchess-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: innerchess-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  db_data: